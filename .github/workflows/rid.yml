name: Latest RID reservoir report
on:
  schedule:
    - cron: '15 1 * * *' # 08:15 Asia/Bangkok; independent of the weather job.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rid-latest-publication
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ingestion configuration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$MONGODB_DB_NAME" ]; then
            echo "::error::Configure repository secrets MONGODB_URI and MONGODB_DB_NAME."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - run: pip install -r pipelines/requirements.txt
      - name: Audit database before RID publication
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin audit
      - name: Publish a validated 35-dam daily report
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m pipelines.rid.run --publish
      - name: Verify active generations, unique indexes and bounded retention
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin verify
      - name: Audit actual storage after publication
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin audit
