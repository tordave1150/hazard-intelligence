name: Latest weather snapshot
on:
  schedule:
    - cron: '0 1 * * *' # 08:00 Asia/Bangkok, once daily
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-latest-publication
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Check ingestion configuration
        id: configuration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          if [ -n "$MONGODB_URI" ] && [ -n "$MONGODB_DB_NAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ingestion not configured. Add MONGODB_URI and MONGODB_DB_NAME repository secrets before running the pipeline."
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node.js 24
        if: steps.configuration.outputs.configured == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - run: pip install -r pipelines/requirements.txt
        if: steps.configuration.outputs.configured == 'true'
      - name: Audit database capacity and indexes before publication
        if: steps.configuration.outputs.configured == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin audit
      - name: Fetch, validate and promote a complete national snapshot
        if: steps.configuration.outputs.configured == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m pipelines.open_meteo.run --level all --publish
      - name: Verify active generations and bounded retention
        if: steps.configuration.outputs.configured == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin verify
