name: Inspect GISTDA Disaster Features
on:
  push:
    branches: [main]
    paths:
      - '.github/gistda-inspection.json'
  workflow_dispatch:
    inputs:
      window:
        description: 'Separate documented product windows. Default is one day; no automatic fallback to another window.'
        required: true
        default: '1day'
        type: choice
        options:
          - 1day
          - 3days
          - 7days
          - 30days
      ap_idn:
        description: 'Four-digit district ID: 2604 = Ongkharak. Clear for an unfiltered service page. No keys or URLs.'
        required: false
        default: '2604'
        type: string
permissions:
  contents: read
concurrency:
  group: gistda-features-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install HTTP client
        run: python -m pip install "requests>=2.32.5,<3"
      - name: Inspect Features metadata without returned URLs or database writes
        if: github.event_name == 'workflow_dispatch'
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          GISTDA_FEATURE_WINDOW: ${{ inputs.window }}
          GISTDA_FEATURE_AP_IDN: ${{ inputs.ap_idn }}
        run: python -m scripts.probe_gistda_features
      - name: Inspect the versioned main request without database writes
        if: github.event_name == 'push'
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: python -m scripts.probe_gistda_features --reviewed-request
