name: Inspect GISTDA Thailand Disaster Features
on:
  push:
    branches: [main]
    paths:
      - '.github/gistda-inspection.json'
  workflow_dispatch:
    inputs:
      service:
        description: 'Features page or documented STAC item metadata; no asset downloads.'
        required: true
        default: features
        type: choice
        options:
          - features
          - stac
      window:
        description: 'Inspect a documented window. The published map uses 3days.'
        required: true
        default: '3days'
        type: choice
        options:
          - 1day
          - 3days
          - 7days
          - 30days
permissions:
  contents: read
concurrency:
  group: gistda-features-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install bounded inspection dependencies
        run: python -m pip install "requests>=2.32.5,<3" "shapely>=2.1,<3"
      - name: Inspect Features metadata without returned URLs or database writes
        if: github.event_name == 'workflow_dispatch'
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          GISTDA_FEATURE_WINDOW: ${{ inputs.window }}
          GISTDA_QUERY_SCOPE: national
          GISTDA_INSPECTION_SERVICE: ${{ inputs.service }}
        run: python -m scripts.probe_gistda_features
      - name: Inspect the national versioned main request without database writes
        if: github.event_name == 'push'
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: python -m scripts.probe_gistda_features --reviewed-request
