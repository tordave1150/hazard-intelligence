name: Inspect GISTDA flood API response
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'v1.0 is the endpoint in the official DGA catalog; the portal v1.1 returned 404 in the first probe.'
        required: true
        default: 'v1.0'
        type: choice
        options:
          - v1.0
          - v1.1
      lat:
        description: 'Query latitude in degrees. Default is the project public Bangkok representative point, not a station or flood measurement.'
        required: false
        default: '13.719961'
        type: string
      lon:
        description: 'Query longitude in degrees. Clear both lat/lon for an authentication-only request.'
        required: false
        default: '100.602017'
        type: string
      area:
        description: 'Optional area value from product #25 documentation. Leave empty if unknown. No keys or URLs.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: gistda-product-25-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install HTTP client
        run: python -m pip install "requests>=2.32.5,<3"
      - name: Inspect response fields without logging values or writing data
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          GISTDA_PROBE_AREA: ${{ inputs.area }}
          GISTDA_PROBE_LAT: ${{ inputs.lat }}
          GISTDA_PROBE_LON: ${{ inputs.lon }}
          GISTDA_PROBE_VERSION: ${{ inputs.version }}
        run: python -m scripts.probe_gistda
