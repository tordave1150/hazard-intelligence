name: Latest Today hourly forecast
on:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *' # 00:17/04:17/08:17/12:17/16:17/20:17 ICT
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-hourly-publication
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install -r pipelines/requirements.txt
      - name: Publish independent hourly snapshot within the shared provider budget
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m pipelines.open_meteo.hourly --publish
      - name: Verify independent pointers and bounded storage
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin verify
