name: Latest Today hourly forecast
on:
  push:
    branches: [main]
    paths:
      - '.github/hourly-publication-request.json'
  schedule:
    - cron: '23 * * * *' # Hourly due checks; collect at most once per 4h, plus a new Bangkok day.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-hourly-publication
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install -r pipelines/requirements.txt
      - name: Check whether an ingestion is due
        id: refresh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          REFRESH_FORCE: ${{ github.event_name != 'schedule' }}
        run: python -m scripts.refresh_guard --source hourly
      - name: Validate hourly publication request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('.github/hourly-publication-request.json')
          if path.stat().st_size>1024:raise ValueError('Publication request too large')
          request=json.loads(path.read_text(encoding='utf-8'))
          if set(request)!={'request_id','source_id','operation'} or request['source_id']!='open_meteo' or request['operation']!='publish_today_hourly':
              raise ValueError('Invalid hourly publication request')
          if not isinstance(request['request_id'],str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}-\d{2}',request['request_id']):
              raise ValueError('Invalid publication request ID')
          print('Validated Today hourly publication request')
          PY
      - name: Check provider HTTPS reachability without credentials
        if: steps.refresh.outputs.due == 'true'
        run: python -m scripts.open_meteo_connectivity
      - name: Publish independent hourly snapshot within the shared provider budget
        if: steps.refresh.outputs.due == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m pipelines.open_meteo.hourly --publish
      - name: Verify independent pointers and bounded storage
        if: steps.refresh.outputs.due == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin verify
