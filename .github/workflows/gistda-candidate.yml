name: Validate GISTDA daily district candidate
on:
  push:
    branches: [main]
    paths: ['.github/gistda-candidate-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gistda-daily-candidate
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install candidate validation dependencies
        run: python -m pip install "requests>=2.32.5,<3" "shapely>=2.1,<3"
      - name: Validate the fixed one-day Ongkharak query in memory
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m scripts.gistda_candidate --reviewed-request
          else
            python -m scripts.gistda_candidate
          fi
