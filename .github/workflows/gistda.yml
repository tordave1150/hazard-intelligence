name: Latest GISTDA Thailand flood products
on:
  push:
    branches: [main]
    paths: ['.github/gistda-publication-request.json']
  schedule:
    - cron: '27 2 * * *' # Daily target 09:27 ICT; actual query time is authoritative.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gistda-thailand-publication
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install -r pipelines/requirements.txt
      - name: Validate fixed-scope reviewed request
        id: request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          from pipelines.gistda.run import check_request
          request=check_request(three_day=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('operation='+request['operation'],file=output)
          PY
      - name: Check ingestion configuration
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          if [ -z "$GISTDA_API_KEY" ] || [ -z "$MONGODB_URI" ] || [ -z "$MONGODB_DB_NAME" ]; then
            echo "::error::Existing GISTDA and MongoDB repository secrets are required."
            exit 1
          fi
      - name: Verify active snapshots before publication
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin verify
      - name: Publish separate complete 3/7/30-day products in compressed chunks
        if: steps.request.outputs.operation != 'verify_thailand_windows' && steps.request.outputs.operation != 'repack_thailand_windows' && steps.request.outputs.operation != 'capacity_thailand_windows'
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m pipelines.gistda.run --publish --all-windows --wait-for-receiver
      - name: Repack the same complete queries without provider requests
        if: steps.request.outputs.operation == 'repack_thailand_windows'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin repack-flood
      - name: Reclaim expired representations after reader cache grace
        if: steps.request.outputs.operation == 'repack_thailand_windows'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          sleep 130
          python -m scripts.mongo_admin prune-flood
      - name: Verify active products and retained compressed objects
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          if [ '${{ steps.request.outputs.operation }}' = 'capacity_thailand_windows' ]; then
            python -m scripts.mongo_admin verify --flood-capacity
          elif [ '${{ steps.request.outputs.operation }}' = 'verify_thailand_windows' ] || [ '${{ steps.request.outputs.operation }}' = 'repack_thailand_windows' ]; then
            python -m scripts.mongo_admin verify --deep-flood --flood-capacity --measure-flood
          else
            python -m scripts.mongo_admin verify
          fi
