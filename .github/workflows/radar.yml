name: Latest TMD radar composite images
on:
  push:
    branches: [main]
    paths: ['pipelines/radar/**', '.github/workflows/radar.yml', 'apps/web/lib/radar*.ts', 'apps/web/app/api/radar/**']
  schedule:
    - cron: '7,22,37,52 * * * *' # Quarter-hour due checks; only fixed half-hour samples are stored.
  workflow_run:
    workflows: ['Latest TMD CAP messages', 'Latest HII Thailand station observations', 'Latest Today hourly forecast', 'Contracts and application checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: tmd-radar-publication
  cancel-in-progress: false
jobs:
  ingest:
    # Recovery runs use reviewed main, never upstream artifacts or an upstream SHA.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.id == 1433731657 &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - run: pip install -r pipelines/requirements.txt
      - name: Capture a stable bounded sequence and publish with scoped short-lived OIDC
        run: python -m pipelines.radar.run --publish --if-due
