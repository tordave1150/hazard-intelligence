name: Latest TMD CAP messages
on:
  push:
    branches: [main]
    paths:
      - '.github/tmd-publication-request.json'
  schedule:
    - cron: '11,41 * * * *' # Half-hour due checks; collect only after 1h or a failed attempt.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tmd-cap-publication
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ingestion configuration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$MONGODB_DB_NAME" ]; then
            echo "::error::Configure repository secrets MONGODB_URI and MONGODB_DB_NAME."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - run: pip install -r pipelines/requirements.txt
      - name: Check whether an ingestion is due
        id: refresh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          REFRESH_FORCE: ${{ github.event_name != 'schedule' }}
        run: python -m scripts.refresh_guard --source tmd
      - name: Validate reviewed publication request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('.github/tmd-publication-request.json')
          if path.stat().st_size>1024:raise ValueError('Publication request too large')
          request=json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(request,dict) or set(request)!={'request_id','source_id','operation'}:
              raise ValueError('Invalid publication request fields')
          if request['source_id']!='tmd' or request['operation']!='publish_latest':
              raise ValueError('Unsupported publication scope')
          if not isinstance(request['request_id'],str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}-\d{2}',request['request_id']):
              raise ValueError('Invalid publication request ID')
          print(json.dumps({'reviewed_request_id':request['request_id'],'source_id':'tmd','scope':'accepted latest CAP snapshot'}))
          PY
      - name: Audit database before CAP publication
        if: steps.refresh.outputs.due == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin audit
      - name: Fetch and publish a complete public CAP feed
        if: steps.refresh.outputs.due == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m pipelines.tmd.run --publish
      - name: Verify coverage, unique indexes and bounded retention
        if: steps.refresh.outputs.due == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin verify
      - name: Audit actual storage after CAP publication
        if: steps.refresh.outputs.due == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: python -m scripts.mongo_admin audit
